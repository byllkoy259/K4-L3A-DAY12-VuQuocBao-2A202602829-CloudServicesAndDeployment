# BONUS — CI/CD: mỗi lần push/PR → test + build trên máy sạch;
# chỉ khi cả hai xanh VÀ là push lên main thì mới deploy lên Render.
#
# Cần cấu hình trên GitHub (Settings → Secrets and variables → Actions):
#   Secret   RENDER_DEPLOY_HOOK_URL  — Deploy Hook của service day12-agent
#   Variable PUBLIC_URL (tùy chọn)   — URL công khai, mặc định dùng URL bên dưới

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # cho phép bấm chạy tay trong tab Actions

permissions:
  contents: read

jobs:
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Bỏ test_cp5 (gọi vào bản deploy đang sống) và test_bonus_cicd (tự kiểm
      # tra badge của chính workflow này). Test build Docker để job `build` lo.
      - name: Run checkpoint tests
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >-
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build -t day12-agent:ci .

      - name: Check image size (< 500MB)
        run: |
          size=$(docker image inspect day12-agent:ci --format '{{.Size}}')
          echo "Image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((500 * 1024 * 1024))

      # Build được chưa đủ — container phải khởi động và trả lời /health
      - name: Run container and probe /health
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// day12-agent:ci
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8000/health; then echo; exit 0; fi
            sleep 1
          done
          echo "::error::container không trả lời /health sau 20 giây"
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Render
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://day12-agent-5b9x.onrender.com' }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::Chưa có secret RENDER_DEPLOY_HOOK_URL (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          curl -fsS -X POST -o /dev/null "$RENDER_DEPLOY_HOOK_URL"
          echo "Đã yêu cầu Render deploy commit ${GITHUB_SHA::7}"

      # Deploy xong mà không kiểm tra thì chỉ biết "lệnh chạy xong", không biết
      # "service còn sống". Free tier có thể đang ngủ → thử lại vài lần.
      - name: Smoke test
        run: |
          sleep 45
          for i in $(seq 1 10); do
            if curl -fsS --max-time 60 "$PUBLIC_URL/health"; then echo; break; fi
            if [ "$i" -eq 10 ]; then
              echo "::error::$PUBLIC_URL/health không trả 200"
              exit 1
            fi
            sleep 15
          done
          curl -fsS --max-time 30 "$PUBLIC_URL/ready"; echo
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$PUBLIC_URL/ask" \
            -H "Content-Type: application/json" -d '{"question":"smoke"}')
          if [ "$code" != "401" ]; then
            echo "::error::/ask không có API key phải trả 401, nhận được $code"
            exit 1
          fi
          echo "/ask không có key → 401 (đúng)"
