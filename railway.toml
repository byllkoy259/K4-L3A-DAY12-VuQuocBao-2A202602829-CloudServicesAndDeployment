# CP5 — Cấu hình deploy Railway (dùng nếu bạn chọn Railway).
#
# Các biến môi trường KHÔNG khai báo ở đây. Đặt chúng trong dashboard hoặc:
#     railway variables --set AGENT_API_KEY=...
#
# Railway tự gán biến PORT — app phải đọc $PORT, đừng cố định 8000.

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Cố ý KHÔNG đặt startCommand: nó sẽ ghi đè CMD của Dockerfile, và Railway
# chạy nó không qua shell nên `$PORT` không được nội suy. CMD trong Dockerfile
# đã tự đọc ${PORT:-8000} và dùng `exec` để uvicorn nhận SIGTERM trực tiếp.
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
